[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kafka-di"
version = "0.1.3"
description = "A lightweight, FastAPI-inspired framework for Kafka consumers and producers."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "confluent-kafka>=2.0",
    "pydantic>=2.12.5",
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["apache-kafka", "confluent-kafka", "event-driven", "kafka"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
authors = [
    { name = "Andrew Balin", email = "i@andrew-balin.ru" }
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kafka_di"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "Q",   # flake8-quotes
    "N",   # pep8-naming
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["kafka_di"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[dependency-groups]
dev = [
    "packaging>=26.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.10",
    "testcontainers>=4.14.2",
]
